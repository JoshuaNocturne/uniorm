name: ci

# Two things this pipeline has to prove:
#
# 1. A build with no ODBC at all still compiles and passes. That is the whole
#    point of UNIORM_BACKEND_ODBC=OFF -- the moment a driver type reaches a
#    public header above the statement layer, this job stops building. This
#    runs on both Linux and Windows to catch platform-specific assumptions
#    early (dlfcn.h vs LoadLibrary, path separators, CRT linkage).
# 2. The suite runs against a live server for each connector paired with the
#    server it is used against: MariaDB's connector with MariaDB 11,
#    Connector/ODBC with MySQL 8.4, psqlODBC with PostgreSQL 17. The cross
#    pairings are out on purpose -- this covers the normal shape of use, not a
#    driver pointed at a server its vendor does not target.
#
#    Development only ever exercises the MariaDB pair, so the other two are
#    here for the generator. The ORM half looks server-independent --
#    src/dialect.cpp:47 gives the MySQL-wire banners the same quoting and
#    pagination, and a PostgreSQL banner the ANSI default -- but uniorm-gen
#    reads metadata out of the server, and that read is the same code either
#    way. MariaDB's connector 3.1.12 asks information_schema for
#    COLUMN_KEY = 'pri'; MySQL 8.4 declares those columns utf8mb3_bin, so
#    nothing matched and the generated header lost its primary key without an
#    error. 3.1.23 asks KEY_COLUMN_USAGE for CONSTRAINT_NAME = 'PRIMARY'
#    instead. CI pins its own connector versions, so the guard against that
#    class of silence is the extraction test comparing generated code with the
#    golden's on every leg: a lost primary key reads as .column where the
#    golden has .primary_key. The comments are cut from both sides before that
#    compare, because how a connector spells BIGINT and how a server stores a
#    default are rendering, and an upgrade of either would otherwise redden
#    three legs at once over nothing. A marker check covers the metadata that
#    leaves no trace in code -- the foreign key and the secondary index. One
#    golden serves all three families because the fixture tables are spelled
#    the way all of them parse. Every leg also asks the server which it is
#    before building, because reaching *a* server is not the gate: a DSN left
#    on the wrong port answers select 1 and runs the suite against a pairing
#    the leg's own name denies.
#
#    That third leg is what found the one place where a driver's answer, not
#    the server's, used to decide a return value: psqlODBC applies every
#    parameter set of an array-bound UPDATE or DELETE but leaves SQLRowCount at
#    the count of a single one, where both MySQL-wire connectors report the
#    total for the array. Those totals agree with what one execute per set sums
#    to, and they are the number update() and remove() return, so the core asks
#    for array_rowcount_totals and sweeps one set per execute without it.
#
# Two of the three drivers do not come from the Ubuntu archive --
# mariadb-connector-odbc is not packaged for any release, and
# mysql-connector-odbc lives only in MySQL's own apt component -- so the driver
# choice splits the legs between install and build. All three were replayed on
# the runner's own image before being written down, and the version each leg
# ends up with is a measurement rather than a preference: apt delivers
# Connector/ODBC 26.7.1, which needs no DSN keys at all, the MariaDB driver's
# 3.2 line fails an array-bound INSERT and that leg stays on 3.1, and apt's
# psqlODBC 16.00 is the one that answered the questions above. The two wire legs
# ran green alongside the cross pairings in a container holding both pinned
# connectors, so the shape this job dropped is measured rather than assumed.
# What the runner has yet to confirm is this shape of the job itself -- the
# matrix picking the image, the port and the probe statement, one service
# carrying three families' env prefixes, and the preflight turning away a DSN
# that answers as some other server. docs/design.md keeps the whole account.
#
# The fourth job is the Oracle OCI backend, and it stays out of that matrix
# because none of it is ODBC: the backend links libclntsh, the core dlopens it
# by scheme name, and the server is a container image no driver here can be
# pointed at. What was replayed before writing it down is the client and the
# suite -- Oracle's public 23.26.4 zip for basic and sdk, the tree configured
# with OCI_ROOT at that directory, and the same integration suite green over a
# live server from it, with the three catalog stages reporting themselves
# skipped because this backend asks the server nothing. The client version is
# pinned for the reason the connector versions are: which DDL names a server
# takes, and how a NUMBER arrives as text, are now assertions in that suite.
# Unconfirmed is the runner's own half -- the image pull, how long its first
# start takes behind the health gate, and which libaio package name its Ubuntu
# carries.
#
# The fifth job is the libpq backend, the second one that links a client
# library rather than reaching a server through a driver manager. It points at
# the same postgres:17 image the psqlODBC leg does, so the two read one server
# by two routes: whatever a connector used to answer for the server, this leg
# is where it shows up as a difference. Its own half was replayed against a
# live container of that image before being written down -- the suite green
# over libpq, with the three catalog stages reporting themselves skipped
# because this backend answers no schema() yet, the same three OCI skips for.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The three variables the database tests read. Without all three they return
  # 77, which ctest records as a Skip and reports as a pass -- see the guard in
  # the Test step, the only thing standing between a broken driver install and a
  # green check.
  UNIORM_IT_DSN: uniorm_ci
  UNIORM_IT_USER: uniorm
  UNIORM_IT_PWD: uniorm-ci-pwd
  DB_NAME: uniorm_ci
  # Warnings are part of the contract here: the tree is warning-clean under
  # -Wall -Wextra today. -Werror is deliberately absent, because a dependency
  # header upgrading would turn an unrelated red into a blocked branch.
  CXXWARN: -Wall -Wextra

jobs:
  core:
    name: core (no ODBC)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Put the ODBC headers out of reach
        run: |
          # Whether the image ships unixodbc-dev is a fact about the image, not a
          # guard, so shadow sql.h and sqlext.h with headers that refuse to be
          # read. The control compile then has to report *our* error: a compiler
          # that cannot run fails for some reason too, and that reason is not
          # the guard working.
          poison="$RUNNER_TEMP/poison"
          ctrl="$RUNNER_TEMP/control.cpp"
          mkdir -p "$poison"
          printf '#error "ODBC header reached the ODBC-free build"\n' |
            tee "$poison/sql.h" "$poison/sqlext.h" >/dev/null
          printf '#include <sql.h>\nint main() { return 0; }\n' > "$ctrl"
          if out="$(c++ -I"$poison" -fsyntax-only "$ctrl" 2>&1)"; then
            echo '::error::the shadowed sql.h lost the include-path race'
            exit 1
          fi
          if [[ "$out" != *"ODBC header reached the ODBC-free build"* ]]; then
            echo '::error::the control compile never reached the shadow'
            printf '%s\n' "$out"
            exit 1
          fi

      - name: Configure
        run: >
          cmake -S . -B build
          -DUNIORM_BACKEND_ODBC=OFF
          -DUNIORM_BUILD_TOOLS=OFF
          -DCMAKE_CXX_FLAGS="$CXXWARN -I$RUNNER_TEMP/poison"

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        run: ctest --test-dir build -R '^unit_tests$' --output-on-failure

  core-windows:
    name: core (no ODBC, Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        env:
          MSYS_NO_PATHCONV: 1
        run: >
          cmake -S . -B build
          -DUNIORM_BACKEND_ODBC=OFF
          -DUNIORM_BUILD_TOOLS=OFF
          -DCMAKE_CXX_FLAGS="/W4"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build -C Debug -R '^unit_tests$' --output-on-failure --timeout 60

  driver:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: core
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mysql-odbc on mysql-8.4
            driver: mysql
            stanza: CI-MySQL
            server_image: mysql:8.4
            server_port: 3306
            # Quoted on purpose: unquoted, YAML reads these as numbers, and the
            # other leg's 11. becomes 11 -- a prefix every MariaDB banner
            # matches.
            server_prefix: '8.4'
            # The probe has to answer with a number first, because the prefix
            # match below is what proves the DSN reached this server.
            version_sql: SELECT VERSION();
            health_cmd: mysqladmin ping -h 127.0.0.1 -uroot
              -puniorm-ci-root --silent
            # Empty: Connector/ODBC 26.7.1 takes every parameter shape under
            # server-side prepares against this server. The key stays as the
            # escape hatch it already was -- 8.4.0 needed NO_SSPS = 1 on either
            # banner MariaDB has used.
            dsn_extra: ''
          - name: mariadb-odbc on mariadb-11
            driver: mariadb
            stanza: CI-MariaDB
            server_image: mariadb:11
            server_port: 3306
            server_prefix: '11.'
            version_sql: SELECT VERSION();
            health_cmd: mariadb-admin ping -h 127.0.0.1 -uroot
              -puniorm-ci-root --silent
            dsn_extra: ''
          - name: postgresql-odbc on postgresql-17
            driver: postgresql
            stanza: CI-PostgreSQL
            server_image: postgres:17
            server_port: 5432
            server_prefix: '17.'
            version_sql: SHOW SERVER_VERSION;
            # Readiness only; unlike mysqladmin this gate sends no password, so
            # the credentials are the preflight's business.
            health_cmd: pg_isready -h 127.0.0.1 -U uniorm -d uniorm_ci
            dsn_extra: ''

    services:
      server:
        image: ${{ matrix.server_image }}
        # A services block cannot read the env context, so these repeat the job
        # map above; the preflight below is what catches a drift, and a wrong
        # root password shows up as the health gate never opening. All three
        # prefixes are set because the image is one of three: MariaDB's
        # entrypoint reads MARIADB_*, MySQL's reads MYSQL_*, and PostgreSQL's
        # reads POSTGRES_*, each ignoring the others, and the values are the
        # same, so no entry can contradict its own image.
        env:
          MARIADB_ROOT_PASSWORD: uniorm-ci-root
          MARIADB_DATABASE: uniorm_ci
          MARIADB_USER: uniorm
          MARIADB_PASSWORD: uniorm-ci-pwd
          MYSQL_ROOT_PASSWORD: uniorm-ci-root
          MYSQL_DATABASE: uniorm_ci
          MYSQL_USER: uniorm
          MYSQL_PASSWORD: uniorm-ci-pwd
          POSTGRES_PASSWORD: uniorm-ci-pwd
          POSTGRES_DB: uniorm_ci
          POSTGRES_USER: uniorm
        ports:
          - ${{ matrix.server_port }}:${{ matrix.server_port }}
        options: >-
          --health-cmd "${{ matrix.health_cmd }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - name: Install the driver manager
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          unixodbc unixodbc-dev libssl-dev

      - name: Install MySQL Connector/ODBC
        if: matrix.driver == 'mysql'
        id: mysql-driver
        run: |
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          # The 2023 file carries the same key with an expiry that lapsed in
          # October 2025; apt then refuses the archive as unsigned. Ask for the
          # refreshed copy.
          curl -fsSL https://repo.mysql.com/RPM-GPG-KEY-mysql-2025 |
            sudo gpg --dearmor -o /usr/share/keyrings/mysql.gpg
          keyring=/usr/share/keyrings/mysql.gpg
          archive=http://repo.mysql.com/apt/ubuntu/
          echo "deb [signed-by=$keyring] $archive $codename mysql-tools" |
            sudo tee /etc/apt/sources.list.d/mysql.list
          sudo apt-get update
          sudo apt-get install -y mysql-connector-odbc
          dpkg -s mysql-connector-odbc | grep '^Version'
          # The connector lands as libmyodbc26a.so (ANSI entry points) and
          # libmyodbc26w.so (Unicode) under an odbc/ directory, next to the
          # authentication plugins. Ask dpkg which one exists rather than
          # naming a version: the 26.x line does not carry the 8.4 tarball's
          # libmyodbc8*.so names. Prefer ANSI -- the Unicode build renders a
          # plain varchar column as SQL_WVARCHAR.
          so="$(dpkg -L mysql-connector-odbc |
            grep -E '/odbc/libmyodbc[^/]*a\.so$' | head -1 || true)"
          echo "path=$so" >> "$GITHUB_OUTPUT"

      - name: Build MariaDB Connector/ODBC
        if: matrix.driver == 'mariadb'
        id: mariadb-driver
        run: |
          # No Ubuntu release packages this driver and the upstream releases
          # carry no binaries, so the only honest route is the tagged source.
          # 3.1, not the 3.2 line: 3.2.9 answers the array-bound INSERT the
          # entity tests issue with (2008) "Client run out of memory" against
          # both servers, and 3.1.23 runs the same suite green.
          git clone --depth 1 --branch 3.1.23 \
            https://github.com/mariadb-corporation/mariadb-connector-odbc.git \
            /tmp/maodbc
          cmake -S /tmp/maodbc -B /tmp/maodbc-build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/maodbc-build -j "$(nproc)"
          sudo cmake --install /tmp/maodbc-build
          # The install puts the driver beside the libmariadb it links and
          # clears the RPATH, so the loader has to be told where that is.
          echo /usr/local/lib/mariadb |
            sudo tee /etc/ld.so.conf.d/maodbc.conf
          sudo ldconfig
          so=/usr/local/lib/mariadb/libmaodbc.so
          test -f "$so"
          echo "path=$so" >> "$GITHUB_OUTPUT"

      - name: Install PostgreSQL's ODBC driver
        if: matrix.driver == 'postgresql'
        id: postgresql-driver
        run: |
          # The one driver of the three that Ubuntu packages: psqlODBC lives in
          # universe, under odbc-postgresql.
          sudo apt-get install -y --no-install-recommends odbc-postgresql
          dpkg -s odbc-postgresql | grep '^Version'
          # psqlodbca.so is the ANSI entry point and psqlodbcw.so the Unicode
          # one, and the same narrow-char boundary the MySQL step names decides
          # between them.
          so="$(dpkg -L odbc-postgresql |
            grep -E '/odbc/psqlodbc[^/]*a\.so$' | head -1 || true)"
          echo "path=$so" >> "$GITHUB_OUTPUT"

      - name: Register the driver and the DSN
        env:
          DRIVER_SO: >-
            ${{ steps.mysql-driver.outputs.path ||
            steps.mariadb-driver.outputs.path ||
            steps.postgresql-driver.outputs.path }}
          DRIVER_STANZA: ${{ matrix.stanza }}
          DSN_EXTRA: ${{ matrix.dsn_extra }}
          DSN_PORT: ${{ matrix.server_port }}
        run: |
          if [ -z "$DRIVER_SO" ] || [ ! -f "$DRIVER_SO" ]; then
            echo "::error::no driver library landed; the install step found \
          nothing to register"
            exit 1
          fi
          {
            printf '[%s]\n' "$DRIVER_STANZA"
            printf 'Description = uniorm CI\n'
            printf 'Driver      = %s\n' "$DRIVER_SO"
            printf 'FileUsage   = 1\n'
          } | sudo tee -a /etc/odbcinst.ini
          # The tests assemble "DSN=<name>;UID=..;PWD=.." themselves, so the
          # target has to be a named data source; no DSN-less string can be
          # passed through UNIORM_IT_DSN. Servername is the spelling all three
          # drivers read: psqlODBC ignores Server outright and reaches for a
          # local unix socket instead.
          {
            printf '[%s]\n' "$UNIORM_IT_DSN"
            printf 'Driver      = %s\n' "$DRIVER_STANZA"
            printf 'Servername  = 127.0.0.1\n'
            printf 'Port        = %s\n' "$DSN_PORT"
            printf 'User        = %s\n' "$UNIORM_IT_USER"
            printf 'Password    = %s\n' "$UNIORM_IT_PWD"
            printf 'Database    = %s\n' "$DB_NAME"
            if [ -n "$DSN_EXTRA" ]; then
              printf '%s\n' "$DSN_EXTRA"
            fi
          } >> "$HOME/.odbc.ini"

      - name: Check the data source answers as the server this leg names
        env:
          SERVER_PREFIX: ${{ matrix.server_prefix }}
          VERSION_SQL: ${{ matrix.version_sql }}
        run: |
          # Reaching *a* server is not the gate: a DSN on the wrong port answers
          # select 1 and runs the whole suite against a pairing this leg
          # does not describe. Ask which server answered instead. Which
          # question names it is the server's own choice, so the probe is
          # per-leg: PostgreSQL answers a banner that starts with its name
          # rather than a number.
          banner="$(echo "$VERSION_SQL" |
            isql -v "$UNIORM_IT_DSN" "$UNIORM_IT_USER" \
              "$UNIORM_IT_PWD" 2>/dev/null |
            sed -n 's/^| *\([0-9][^|]*[^ |]\) *|.*/\1/p' | head -1)"
          case "$banner" in
            "$SERVER_PREFIX"*)
              echo "server behind $UNIORM_IT_DSN: $banner"
              ;;
            *)
              echo "::error::$UNIORM_IT_DSN is not on a $SERVER_PREFIX* server"
              echo "  it answered '${banner:-nothing}'"
              exit 1
              ;;
          esac

      - name: Configure
        run: >
          cmake -S . -B build
          -DUNIORM_BACKEND_ODBC=ON
          -DUNIORM_BUILD_TOOLS=ON
          -DCMAKE_CXX_FLAGS="$CXXWARN"

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        run: |
          set -o pipefail
          # Verbose because the integration case records how this leg's server
          # stores the names it was given. A failing test's output ctest prints
          # anyway; a passing one it prints only here.
          ctest --test-dir build -LE perf --output-on-failure -V | tee ctest.log
          # A skip is this job failing: the database tests return 77 when they
          # cannot connect, and ctest counts that as a pass. pipefail covers
          # the failures; nothing but this covers a suite that never ran.
          if grep -q 'Skipped' ctest.log; then
            echo '::error::a database test skipped instead of running.'
            grep -A5 'did not run' ctest.log || true
            exit 1
          fi

      - name: Show what the driver manager saw
        if: failure()
        run: |
          # No odbcinst here: Ubuntu ships it as its own package, separate
          # from the unixodbc tools this job installs.
          cat /etc/odbcinst.ini
          cat "$HOME/.odbc.ini"
          echo 'select 1' |
            isql -v "$UNIORM_IT_DSN" "$UNIORM_IT_USER" "$UNIORM_IT_PWD" || true

  oracle-oci:
    name: oracle-oci on oracle-free
    runs-on: ubuntu-latest
    needs: core
    timeout-minutes: 40

    # This one is not a leg of the matrix above because it goes through no
    # driver manager at all: the backend links a client library, and the core
    # reaches it by dlopen on the scheme name. So the job installs that library
    # and starts a server, and what it proves is the same thing the matrix
    # proves of a connector -- that a plugin outside the core carries the whole
    # suite -- over a family no ODBC driver in this file can be pointed at.
    env:
      # Job env wins over the workflow map, and this leg has no DSN to name:
      # the target is host:port/service, which is what the suite folds into the
      # connect string for scheme "oracle".
      UNIORM_IT_BACKEND: oracle
      UNIORM_IT_DSN: 127.0.0.1:1521/FREEPDB1
      UNIORM_IT_USER: SYSTEM
      UNIORM_IT_PWD: uniorm-ci-pwd

    services:
      oracle:
        # slim, because the leg needs no option the base image lacks;
        # faststart, because the flavour's whole point is a database already
        # expanded for a container that is started once and thrown away.
        # healthcheck.sh is the image's own gate, and a first start creates the
        # pluggable database, so the window is measured in minutes: 30 tries at
        # 10s, where the default would report a server still coming up as one
        # that will not.
        image: gvenzl/oracle-free:slim-faststart
        env:
          ORACLE_PASSWORD: uniorm-ci-pwd
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v7

      - name: Install the Oracle client library
        run: |
          # The public zip tree, not the yum repo: its el9 package names ask
          # for (libaio(x86-64) or libaio1(x86-64)) and a glibc the resolver
          # here reads as Oracle Linux, so apt cannot take them as they are.
          # The unzipped layout -- library loose at the root, headers under
          # sdk/include -- is the one cmake/FindOracleOCI.cmake searches, and
          # OCI_ROOT is the hint it was written for.
          version=23.26.4.0.0
          tree=2326400
          root="$RUNNER_TEMP/oci"
          mkdir -p "$root"
          base=https://download.oracle.com/otn_software/linux/instantclient
          for part in basic sdk; do
            curl -fSL --retry 3 -o "$root/$part.zip" \
              "$base/$tree/instantclient-$part-linux.x64-$version.zip"
            # -o, not a bare -q: both archives carry a META-INF/, so the second
            # one would be asked about, and a prompt that reads EOF is a
            # nonzero exit here rather than an overwrite.
            unzip -qo "$root/$part.zip" -d "$root"
          done
          client="$root/instantclient_23_26"
          # Both halves or nothing: a header tree without its library would
          # configure against a different client than the one it links.
          test -f "$client/sdk/include/oci.h"
          test -f "$client/libclntsh.so"
          echo "OCI_ROOT=$client" >> "$GITHUB_ENV"
          # An unzipped Instant Client keeps its members loose at the root, and
          # libclntsh asks for them by unversioned name (libnnz.so, the core
          # library) with no path of its own to be found by: a RUNPATH on the
          # binary resolves only what that binary links, so the rest of the
          # client reaches the loader through LD_LIBRARY_PATH alone.
          echo "LD_LIBRARY_PATH=$client" >> "$GITHUB_ENV"
          # The one thing this client asks the operating system for. Ubuntu
          # renamed the package under the time_t transition and its SONAME with
          # it -- libaio.so.1t64 -- while the client still asks for
          # libaio.so.1, so the search must not be satisfied by the t64 name as
          # a prefix: that finds a library that cannot be the one the loader
          # wants, and the client then fails to load for a reason this step
          # already concluded was handled.
          if ! ldconfig -p | grep -qE 'libaio\.so\.1([[:space:]]|$)'; then
            sudo apt-get update
            sudo apt-get install -y libaio1t64 ||
              sudo apt-get install -y libaio1
          fi
          # Give the client the name it asks for, in the directory the loader is
          # already told to search, and say so out loud rather than leaving a
          # dlopen failure as the only record.
          t64="$(ldconfig -p |
            sed -n 's/.*=> \(.*libaio\.so\.1t64\)$/\1/p' | head -1)"
          if [ -n "$t64" ]; then
            ln -sf "$t64" "$client/libaio.so.1"
            echo "libaio.so.1 -> $t64"
          elif ! ldconfig -p | grep -qE 'libaio\.so\.1([[:space:]]|$)'; then
            echo "::error::no libaio for the Oracle client to ask for"
            exit 1
          fi

      - name: Configure
        run: >
          cmake -S . -B build
          -DUNIORM_BACKEND_ODBC=OFF
          -DUNIORM_BUILD_TOOLS=OFF
          -DUNIORM_BACKEND_ORACLE_OCI=ON
          -DCMAKE_CXX_FLAGS="$CXXWARN"

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure -V | tee ctest.log
          # The same rule the matrix legs keep: 77 is a skip and ctest calls
          # that a pass, so a leg that never reached its server fails here.
          if grep -q 'Skipped' ctest.log; then
            echo '::error::a database test skipped instead of running.'
            grep -A5 'did not run' ctest.log || true
            exit 1
          fi
          # And the suite names the server it reached, from the banner the
          # connection itself reports. Reaching a server is not the gate;
          # reaching the one this job's name claims is.
          banner="$(sed -n 's/^.*dbms = //p' ctest.log | head -1)"
          case "$banner" in
            Oracle*)
              echo "server behind the OCI leg: $banner"
              ;;
            *)
              echo "::error::the OCI leg did not answer as Oracle"
              echo "  it answered '${banner:-nothing}'"
              exit 1
              ;;
          esac

      - name: Show what the client and the server said
        if: failure()
        run: |
          ls -l "$OCI_ROOT" 2>/dev/null || echo 'no client tree to show'
          # What the loader could not place, from the same environment the test
          # ran in -- an unlisted member of the client tree looks like this and
          # nothing else.
          ldd build/backends/oracle_oci/libuniorm_oracle.so 2>/dev/null |
            grep 'not found' || true
          # A refused logon is written out beside the working directory before
          # anything can report it, and it is the only record when the failure
          # never reached a statement.
          cat sqlnet.log 2>/dev/null || true
          container="$(docker ps -q --filter publish=1521 | head -1)"
          if [ -n "$container" ]; then
            docker logs --tail 60 "$container" 2>&1 || true
          fi

  libpq:
    name: libpq on postgresql-17
    runs-on: ubuntu-latest
    needs: core
    timeout-minutes: 30

    # Out of the matrix above for the same reason the OCI job is: none of it
    # goes through a driver manager. The core dlopens libuniorm_postgresql.so
    # on the scheme name, the backend links libpq, and the target the suite
    # builds a connect string from is host:port/service rather than a DSN.
    env:
      UNIORM_IT_BACKEND: postgresql
      UNIORM_IT_DSN: 127.0.0.1:5432/uniorm_ci
      UNIORM_IT_USER: uniorm
      UNIORM_IT_PWD: uniorm-ci-pwd

    services:
      server:
        # The image the psqlODBC leg is pointed at, so the two legs read the
        # same server by two routes rather than two servers.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: uniorm-ci-pwd
          POSTGRES_DB: uniorm_ci
          POSTGRES_USER: uniorm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U uniorm -d uniorm_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - name: Install libpq
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DUNIORM_BACKEND_ODBC=OFF
          -DUNIORM_BUILD_TOOLS=OFF
          -DUNIORM_BACKEND_LIBPQ=ON
          -DCMAKE_CXX_FLAGS="$CXXWARN"

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        run: |
          set -o pipefail
          ctest --test-dir build --output-on-failure -V | tee ctest.log
          # The same rule the other database legs keep: 77 is a skip and ctest
          # calls that a pass, so a leg that never reached its server is a
          # failure here rather than a green check.
          if grep -q 'Skipped' ctest.log; then
            echo '::error::a database test skipped instead of running.'
            grep -A5 'did not run' ctest.log || true
            exit 1
          fi
          banner="$(sed -n 's/^.*dbms = //p' ctest.log | head -1)"
          case "$banner" in
            PostgreSQL*)
              echo "server behind the libpq leg: $banner"
              ;;
            *)
              echo "::error::the libpq leg did not answer as PostgreSQL"
              echo "  it answered '${banner:-nothing}'"
              exit 1
              ;;
          esac

      - name: Show what the client and the server said
        if: failure()
        run: |
          # A client library the loader cannot place looks like this and nothing
          # else; the version apt delivered is the one the leg linked against.
          dpkg -s libpq-dev | grep '^Version' || true
          ldd build/backends/libpq/libuniorm_postgresql.so 2>/dev/null |
            grep 'not found' || true
          container="$(docker ps -q --filter publish=5432 | head -1)"
          if [ -n "$container" ]; then
            docker logs --tail 60 "$container" 2>&1 || true
          fi
